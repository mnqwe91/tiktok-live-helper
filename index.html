<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>مساعد بلاغات تيك توك</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;padding:22px 16px 40px}
main{max-width:520px;margin:auto}.card{background:#151d31;border:1px solid #29344d;border-radius:20px;padding:20px;box-shadow:0 12px 35px #0004}
h1{font-size:24px;margin:0 0 8px}.sub{color:#b8c3d9;line-height:1.7;margin:0 0 20px}
label{display:block;margin:16px 0 8px;font-weight:700}input,select,textarea{width:100%;padding:14px;border-radius:12px;border:1px solid #3b4965;background:#0e1628;color:white;font:inherit}
textarea{min-height:145px;resize:vertical;line-height:1.7}.btn{width:100%;border:0;border-radius:12px;padding:14px;margin-top:12px;font:inherit;font-weight:700;background:#f43f5e;color:white}.secondary{background:#334155}.hint{font-size:13px;color:#aab7cf;line-height:1.7;margin-top:16px}
.status{min-height:22px;color:#86efac;font-size:14px;margin-top:8px}
</style>
</head>
<body><main><section class="card">
<h1>مساعد بلاغات تيك توك</h1>
<p class="sub">أداة تساعدك على تجهيز بلاغ واضح عن مخالفة محتملة تتعلق بسلامة القاصرين. الإرسال يتم يدوياً من داخل تيك توك.</p>
<label for="url">رابط البث أو الحساب</label>
<input id="url" type="url" placeholder="https://www.tiktok.com/..." value="https://vt.tiktok.com/ZS9Px6BEyGt3Y-5Jb7J/">
<label for="reason">نوع المخالفة</label>
<select id="reason">
<option>اشتباه باستغلال قاصر</option>
<option>محتوى غير مناسب يظهر فيه قاصر</option>
<option>تعريض قاصر للخطر</option>
<option>مخالفة أخرى تتعلق بسلامة القاصرين</option>
</select>
<label for="notes">تفاصيل مختصرة (اختياري)</label>
<textarea id="notes" placeholder="اكتب ما شاهدته فعلاً، دون تخمين أو مبالغة."></textarea>
<label for="report">نص البلاغ</label>
<textarea id="report" readonly></textarea>
<button class="btn" id="make">تجهيز نص البلاغ</button>
<button class="btn secondary" id="copy">نسخ نص البلاغ</button>
<button class="btn secondary" id="open">فتح رابط تيك توك</button>
<div class="status" id="status" aria-live="polite"></div>
<p class="hint">أرسل بلاغاً صادقاً عن مخالفة شاهدتها فعلاً. لا ترسل بلاغات مكررة أو جماعية. إذا كان طفل في خطر مباشر، تواصل مع الجهات المختصة.</p>
</section></main>
<script>
const $=id=>document.getElementById(id);
function make(){
 const link=$('url').value.trim(), reason=$('reason').value, notes=$('notes').value.trim();
 $('report').value=`أرجو مراجعة هذا المحتوى بسبب: ${reason}.\n${notes?`التفاصيل التي شاهدتها: ${notes}\n`:''}الرابط: ${link}\nيرجى التحقق واتخاذ الإجراء المناسب إذا ثبتت المخالفة.`;
 $('status').textContent='تم تجهيز نص البلاغ.';
}
$('make').addEventListener('click',make);
$('copy').addEventListener('click',async()=>{
 if(!$('report').value)make();
 try{await navigator.clipboard.writeText($('report').value);$('status').textContent='تم نسخ نص البلاغ.'}
 catch(e){$('report').focus();$('report').select();$('status').textContent='حدّد النص وانسخه يدوياً.'}
});
$('open').addEventListener('click',()=>{
 const u=$('url').value.trim();
 try{const parsed=new URL(u);if(!['https:','http:'].includes(parsed.protocol))throw 0;window.open(parsed.href,'_blank','noopener')}
 catch(e){$('status').textContent='تحقق من صحة الرابط أولاً.'}
});
make();
</script></body></html>
