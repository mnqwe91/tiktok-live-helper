<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>أبو عنزي | Username Hunter</title>
<style>
:root{--gold:#d6b15e;--gold2:#f0d58c;--bg:#090909;--panel:#151515;--line:#393124;--muted:#c8c1b2;--white:#fff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:24px 16px 44px;background:radial-gradient(ellipse at top,#292115 0,#111 38%,#080808 78%);color:var(--white);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif}
main{max-width:560px;margin:auto}
header{text-align:center;padding:18px 8px 24px}
.logo{width:66px;height:66px;margin:0 auto 12px;border:1.5px solid var(--gold);border-radius:22px;display:grid;place-items:center;color:var(--gold2);font-size:27px;font-weight:900;box-shadow:0 0 28px #d6b15e24}
.brand{font-size:29px;font-weight:900;letter-spacing:.2px;color:var(--gold2);margin:0}
.tag{color:var(--muted);font-size:13px;margin:7px 0 0}
.card{background:linear-gradient(155deg,#1b1a17,#111);border:1px solid var(--line);border-radius:23px;padding:20px;box-shadow:0 18px 50px #0008}
h2{font-size:18px;margin:0 0 6px;color:var(--gold2)}
.desc{color:var(--muted);font-size:13px;line-height:1.7;margin:0 0 18px}
label{display:block;font-weight:700;margin:16px 0 8px;color:#f5e8c7}
select,input{width:100%;padding:14px;border:1px solid #51452e;border-radius:13px;background:#0b0b0b;color:#fff;font:inherit;outline:none}
select:focus,input:focus{border-color:var(--gold)}
button{width:100%;padding:14px;border:0;border-radius:13px;margin-top:12px;background:linear-gradient(100deg,#b88d3d,#f0d58c);color:#17120a;font:inherit;font-weight:900}
.secondary{background:#24211b;color:var(--gold2);border:1px solid #6b5732}
.results{margin-top:17px;display:grid;gap:9px}
.item{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#0b0b0b;border:1px solid #3d3425;border-radius:12px;padding:10px 12px;direction:ltr}
.item code{font-size:16px;color:#fff}
.item button{width:auto;margin:0;padding:8px 13px;font-size:13px}
.status{color:var(--gold2);min-height:22px;margin-top:12px;font-size:14px}
.note{font-size:12px;color:#aaa18f;line-height:1.8;margin:18px 2px 0}
footer{text-align:center;color:#817966;font-size:11px;margin-top:17px}
</style>
</head>
<body>
<main>
<header>
 <div class="logo">ع</div>
 <h1 class="brand">أبو عنزي</h1>
 <p class="tag">TIKTOK USERNAME HUNTER</p>
</header>
<section class="card">
 <h2>مولّد اليوزرات</h2>
 <p class="desc">اختر نوع اليوزر وعدد الاقتراحات، ثم ولّد أسماء وانسخ اللي يعجبك.</p>
 <label for="kind">نوع اليوزر</label>
 <select id="kind">
  <option value="3">ثلاثي — 3 خانات</option>
  <option value="4">رباعي — 4 خانات</option>
  <option value="semi">شبه ثلاثي — 3 أحرف مع نقطة أو شرطة سفلية</option>
 </select>
 <label for="count">عدد الاقتراحات</label>
 <select id="count"><option>10</option><option selected>20</option><option>30</option><option>50</option></select>
 <label for="chars">أحرف وأرقام مفضلة (اختياري)</label>
 <input id="chars" maxlength="36" placeholder="مثال: abcd123 — اتركه فارغاً للافتراضي">
 <button id="generate">توليد يوزرات</button>
 <button id="copyAll" class="secondary">نسخ كل النتائج</button>
 <div class="status" id="status" aria-live="polite"></div>
 <div class="results" id="results"></div>
 <p class="note">الأداة تولّد اقتراحات فقط، ولا تتحقق من توفر اليوزر أو تحجزه. تحقق من التوفر يدوياً داخل تيك توك.</p>
</section>
<footer>أبو عنزي · Gold & White Edition</footer>
</main>
<script>
const $=id=>document.getElementById(id);let current=[];
function rand(n){return Math.floor(Math.random()*n)}
function generate(){
 const kind=$('kind').value,count=+$('count').value;
 const chars=[...new Set(($('chars').value.trim()||'abcdefghijklmnopqrstuvwxyz0123456789').replace(/[^a-zA-Z0-9]/g,''))];
 if(chars.length<2){$('status').textContent='أدخل حرفين أو رقمين على الأقل.';return}
 const set=new Set();let attempts=0;
 while(set.size<count&&attempts<count*100){attempts++;let s='';
  if(kind==='semi'){for(let i=0;i<3;i++)s+=chars[rand(chars.length)];const sep=rand(2)?'_':'.',pos=1+rand(2);s=s.slice(0,pos)+sep+s.slice(pos)}
  else{for(let i=0;i<Number(kind);i++)s+=chars[rand(chars.length)]}
  set.add(s.toLowerCase());
 }
 current=[...set];$('results').replaceChildren();
 current.forEach(u=>{const div=document.createElement('div');div.className='item';const code=document.createElement('code');code.textContent='@'+u;const b=document.createElement('button');b.textContent='نسخ';b.onclick=async()=>{try{await navigator.clipboard.writeText(u);$('status').textContent='تم نسخ @'+u}catch(e){$('status').textContent='تعذر النسخ؛ حدّد الاسم وانسخه يدوياً.'}};div.append(code,b);$('results').append(div)});
 $('status').textContent=`تم توليد ${current.length} اقتراحاً.`;
}
$('generate').onclick=generate;
$('copyAll').onclick=async()=>{if(!current.length)generate();if(current.length){try{await navigator.clipboard.writeText(current.join('\n'));$('status').textContent='تم نسخ جميع النتائج.'}catch(e){$('status').textContent='تعذر النسخ التلقائي على هذا المتصفح.'}}};
generate();
</script>
</body></html>
